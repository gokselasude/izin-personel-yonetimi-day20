# Veritabanı bağlantı bilgileri docker-compose.yml içindeki
# SPRING_DATASOURCE_URL / USERNAME / PASSWORD environment variable'larından gelir.
# Burada sabit (hardcoded) bir veritabanı tanımlanmaz.

# JPA / Hibernate Ayarları
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Liquibase Ayarları
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
