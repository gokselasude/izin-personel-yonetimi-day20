<div class="container mt-4">
  <h2>Personel Yönetimi</h2>
  <table class="table table-striped table-bordered mt-3">
    <thead>
    <tr>
      <th>ID</th>
      <th>Ad</th>
      <th>Soyad</th>
      <th>E-posta</th>
      <th>Rol</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let emp of employees">
      <td>{{ emp.id }}</td>
      <td>{{ emp.firstName }}</td>
      <td>{{ emp.lastName }}</td>
      <td>{{ emp.email }}</td>
      <td>{{ emp.role }}</td>
    </tr>
    </tbody>
  </table>
</div>
